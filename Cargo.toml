[workspace]
resolver = "2"
members = [
    "crates/core-protocol",
    "crates/camera-capture",
    "crates/vcam-sink",
    "crates/app-mobile",
    "crates/app-desktop",
]

[workspace.package]
version = "26.0.0"
edition = "2021"
authors = ["OpenCamLink Contributors <dev@opencamlink.org>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/opencamlink/opencamlink"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
bytes = "1.10"
mdns-sd = "0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2.0"
anyhow = "1.0"
egui = "0.37"
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"

# Internal workspace crates
core-protocol = { path = "crates/core-protocol" }
camera-capture = { path = "crates/camera-capture" }
vcam-sink = { path = "crates/vcam-sink" }

