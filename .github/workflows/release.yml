name: Release Build

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. 26.0)'
        required: false
        default: '26.0'

permissions:
  contents: write

jobs:
  build-desktop-linux:
    name: Build Desktop (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libv4l-dev libasound2-dev libudev-dev

      - name: Build Release Binary
        run: cargo build --release --package app-desktop --target x86_64-unknown-linux-gnu

      - name: Package Artifact
        run: |
          mkdir -p dist/opencam-linux-x86_64
          cp target/x86_64-unknown-linux-gnu/release/app-desktop dist/opencam-linux-x86_64/opencam-studio
          cp README.md dist/opencam-linux-x86_64/
          cd dist
          tar -czvf ../opencam-desktop-linux-x86_64.tar.gz opencam-linux-x86_64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencam-desktop-linux-x86_64
          path: opencam-desktop-linux-x86_64.tar.gz

  build-desktop-windows:
    name: Build Desktop (Windows x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --package app-desktop --target x86_64-pc-windows-msvc

      - name: Package Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item target/x86_64-pc-windows-msvc/release/app-desktop.exe dist/opencam-studio-windows-x86_64.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencam-studio-windows-x86_64
          path: dist/opencam-studio-windows-x86_64.exe

  build-mobile-android:
    name: Build Mobile (Android ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Native Android Libraries (.so)
        run: |
          mkdir -p crates/app-mobile/android/app/src/main/jniLibs/arm64-v8a
          cargo ndk -t arm64-v8a -o crates/app-mobile/android/app/src/main/jniLibs build --release --package app-mobile --lib

      - name: Build and Sign Android APK
        run: |
          # 1. Debug Keystore
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Locate Android Build Tools
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM_JAR=$(ls -d $ANDROID_HOME/platforms/android-*/android.jar | sort -V | tail -n 1)
          echo "Using Build-Tools: $BUILD_TOOLS_DIR"
          echo "Using Platform Jar: $PLATFORM_JAR"

          AAPT2="$BUILD_TOOLS_DIR/aapt2"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          # 3. Create Base Package from AndroidManifest.xml
          $AAPT2 link -I "$PLATFORM_JAR" --manifest crates/app-mobile/android/AndroidManifest.xml -o unaligned.apk

          # 4. Inject native library into unaligned.apk
          python3 -c "
          import zipfile
          with zipfile.ZipFile('unaligned.apk', 'a', compression=zipfile.ZIP_DEFLATED) as zf:
              zf.write('crates/app-mobile/android/app/src/main/jniLibs/arm64-v8a/libapp_mobile.so', 'lib/arm64-v8a/libapp_mobile.so')
          "

          # 5. Zipalign (4-byte boundary)
          \"$ZIPALIGN\" -v -f 4 unaligned.apk aligned.apk

          # 6. Sign APK with apksigner (v1, v2, v3 schemes)
          \"$APKSIGNER\" sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android --out opencam-mobile-android-arm64.apk aligned.apk

          # 7. Verify APK
          \"$APKSIGNER\" verify -v opencam-mobile-android-arm64.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencam-mobile-android-arm64
          path: opencam-mobile-android-arm64.apk

  create-github-release:
    name: Create GitHub Release
    needs: [build-desktop-linux, build-desktop-windows, build-mobile-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG }}
          name: "OpenCam ${{ steps.tag_info.outputs.TAG }}"
          body: |
            ## OpenCam Release ${{ steps.tag_info.outputs.TAG }}

            Suite webcam virtuelle 100% Rust multiplateforme à ultra-faible latence (< 20ms LAN).

            ### Nouveautés & Correctifs
            - **Régie Broadcast Multi-Cam :** Commutation instantanée 1-clic avec bus Tally (Program / Preview).
            - **Center Stage IA :** Suivi dynamique du visage avec auto-zoom proportionnel à la distance du sujet.
            - **Sortie Système :** Injection directe dans `/dev/video10` (Linux v4l2loopback) et Windows Media Foundation.
            - **Réseau :** Découverte mDNS automatique et transport vidéo UDP avec réassembleur drop-on-late.

            ### Fichiers de Release
            - Linux x86_64 : `opencam-desktop-linux-x86_64.tar.gz`
            - Windows x86_64 : `opencam-studio-windows-x86_64.exe` (Exécutable direct)
            - Android ARM64 : `opencam-mobile-android-arm64.apk` (APK installable directement)
            - Empreintes cryptographiques : `SHA256SUMS.txt`
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

